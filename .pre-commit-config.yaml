repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3.11
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.2
    hooks:
      - id: flake8
        # required for flake8 to read [tool.flake8] from pyproject.toml
        additional_dependencies: [Flake8-pyproject==1.2.3]
