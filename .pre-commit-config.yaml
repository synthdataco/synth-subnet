repos:
  - repo: https://github.com/psf/black
    # Keep in sync with the black version resolved in uv.lock (and used by
    # `uv run black` / CI). black formatting changes between releases, so a
    # stale rev here reformats differently than CI and fights the pipeline.
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3.11
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.2
    hooks:
      - id: flake8
        # flake8 doesn't read pyproject.toml on its own; this plugin lets the
        # hook's isolated env pick up [tool.flake8] (extend-ignore, etc.),
        # matching `uv run flake8` and CI.
        additional_dependencies: ["Flake8-pyproject==1.2.3"]
