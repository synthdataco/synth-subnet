[project]
name = "synth-subnet"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.37.2",
    "pydantic>=2",
    "rich>=13",
    "numpy>=1",
    "setuptools>=68",
    "requests>=2",
    "properscoring>=0.1",
    "pandas>=2.2.3",
    "bittensor==10.0.1",
    "bittensor-cli==9.17.0",
    "async-substrate-interface==1.5.15",
    "substrate-interface==1.7.11",
    "alembic>=1.14.0",
    "python-dotenv>=1.0.1",
    "psycopg2-binary>=2.9.10",
    "sqlalchemy>=2.0.36",
    "wandb>=0.19.4",
    "tenacity==9.0.0",
    "google-cloud-bigtable>=2.23.0",
    "google-cloud-logging==3.12.1",
    "uvloop==0.21.0",
    "httpx[http2]==0.28.1",
    "anyio==4.12.1",
    "numba==0.63.1",
    "hyperliquid-python-sdk==0.22.0",
    "fiber",
    "netaddr==1.3.0",
]

[dependency-groups]
dev = [
    "pre-commit==4.1.0",
    "pytest>=8",
    "black>=25.1.0",
    "testcontainers>=4.9.0",
    "pylint>=3.3.4",
    "flake8==7.1.2",
    "mypy==1.15.0",
    "mypy-extensions==1.0.0",
    "pandas-stubs==2.2.2.240807",
    "types-requests==2.32.0.20250328",
    "Flake8-pyproject==1.2.3",
]

[tool.uv]
package = false
# Fiber pins async-substrate-interface==1.1.1, substrate-interface==1.7.10,
# pydantic<=2.9.2, python-dotenv==1.0.1 and eth-typing==5.0.0, which conflict
# with bittensor 10.0.1 and our own pins. The fiber.chain modules we use work
# with the newer versions, so override fiber's stale constraints.
override-dependencies = [
    "async-substrate-interface==1.5.15",
    "substrate-interface==1.7.11",
    "pydantic>=2",
    "python-dotenv>=1.0.1",
    "eth-typing>=5",
]

[tool.uv.sources]
fiber = { git = "https://github.com/chutesai/fiber.git", tag = "2.5.0" }

[tool.black]
line-length = 79
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | env
  | venv
  | bt_venv
  | .eggs
)/
'''

[tool.mypy]
disable_error_code = ["type-arg", "import-untyped", "no-untyped-def", "no-untyped-call"]
python_version = "3.11"
strict = true
show_error_codes = true
warn_unused_ignores = true
exclude = ["venv", "bt_venv", ".venv"]

[tool.pylint]
ignore = [".git","__pycache__","old","build","dist","venv",".venv","bt_venv"]

[tool.pylint.messages_control]
max-args = 10
disable = [
    "consider-using-generator",
    "line-too-long",
    "unnecessary-pass",
    "fixme",
    "missing-function-docstring",
    "broad-exception-caught",
    "missing-module-docstring"
]

[tool.flake8]
extend-ignore = ["E501", "E203"]
exclude = [".git","__pycache__","old","build","dist","bt_venv","venv",".venv", "docs"]
max-complexity = 10
